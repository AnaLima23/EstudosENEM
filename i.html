<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudos para o ENEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      color: #333;
    }

    .screen { display: none; min-height: 100vh; padding: 50px 20px; box-sizing: border-box; }
    .active { display: block; }

    .btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(102,126,234,0.6); }

    .areas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .area {
      background: linear-gradient(135deg, #f6d365, #fda085);
      padding: 25px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .area:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(246,211,101,0.6); }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      justify-items: center;
      margin-top: 40px;
    }

    .card {
      width: 220px;
      height: 160px;
      perspective: 1000px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .card:hover { transform: translateY(-5px); }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      padding: 15px;
      box-sizing: border-box;
      font-weight: 500;
      font-size: 16px;
      text-align: center;
    }

    .card-front {
      background: url('https://images.unsplash.com/photo-1581091012184-3a9c26e947b4?auto=format&fit=crop&w=800&q=60') no-repeat center/cover;
      color: #fff;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
      font-weight: 600;
    }

    .card-back {
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #333;
      transform: rotateY(180deg);
      font-weight: 500;
    }

    .back-btn { margin-top: 30px; background: linear-gradient(135deg, #ff758c, #ff7eb3); }
  </style>
</head>
<body>

  <!-- Tela Inicial -->
  <div id="screen-start" class="screen active">
    <h1>Entre e estude para o ENEM</h1>
    <button class="btn" onclick="goToAreas()">Começar</button>
  </div>

  <!-- Tela de Áreas -->
  <div id="screen-areas" class="screen">
    <h1>Escolha a Área</h1>
    <div class="areas">
      <div class="area" onclick="showCards('Filosofia')">Filosofia</div>
      <div class="area" onclick="showCards('Matemática')">Matemática</div>
      <div class="area" onclick="showCards('Biologia')">Biologia</div>
      <div class="area" onclick="showCards('Química')">Química</div>
    </div>
  </div>

  <!-- Tela de Cards -->
  <div id="screen-cards" class="screen">
    <h1 id="cards-title"></h1>
    <div class="cards-container" id="cards-container"></div>
    <button class="btn back-btn" onclick="backToAreas()">Voltar</button>
  </div>

  <script>
    const screens = {
      start: document.getElementById('screen-start'),
      areas: document.getElementById('screen-areas'),
      cards: document.getElementById('screen-cards')
    };

    const questions = {
      Filosofia: [
        { q: "Quem disse 'Penso, logo existo'?", a: "René Descartes" },
        { q: "O que é ética?", a: "Estudo dos valores morais e princípios do comportamento humano" },
        { q: "O que é utilitarismo?", a: "Doutrina que busca o maior bem para o maior número de pessoas" }
      ],
      Matemática: [
        { q: "7", a: "Um dos problemas decorrentes do melhoramento genético é a perda de variabilidade genética nas linhagens produzidas, deixando-as muito vulneráveis a mudanças no ambiente. Sabe-se que as espécies evoluem graças à variabilidade genética, que é garantida por dois processos básicos. São eles:recombinação gênica (crossing over) e mutação gênica. " },
        { q: "8", a: "O milho transgênico é produzido a partir da manipulação do milho original, com a transferência, para este, de um gene de interesse retirado de outro organismo de espécie diferente. A característica de interesse será manifestada em decorrência:da tradução do RNA mensageiro sintetizado a partir do DNA recombinante" },
        { q: "9", a: "A palavra biotecnologia surgiu no século XX, quando o cientista Herbert Boyer introduziu a informação responsável pela fabricação da insulina humana em uma bactéria, para que ela passasse a produzir a substância. As bactérias modificadas por Herbert Boyer passaram a produzir insulina humana porque receberam:a sequência de DNA codificante do gene da insulina humana." }
      ],
      Biologia: [
        { q: "Pergunta 1", a: "Alterações na sequência de bases dos nucleotídeos do ácido desoxirribonucleico (DNA), podem produzir numerosas e extraordinárias mutações, que:b. Se constituem na fonte primária de toda a diversidade genética nos seres vivos" },
        { q: "2",a:"Um surfista com dano de DNA UV terá filhos com tumores? Não, ele não herdará os tumores" },
        { q: "3", a: "Um pesquisador submeteu sementes de uma planta a doses prolongadas de radiação. Após plantar uma das sementes irradiadas, obteve um novo tipo de planta, idêntica à original, com exceção da cor de suas flores, uma vez que a nova planta possuía uma flor de coloração escura. Ao analisar essas flores, ele descobriu que a nova coloração era devida à produção de um novo tipo de pigmento. Estudos posteriores revelaram que esse pigmento era sintetizado por uma enzima idêntica a uma enzima presente na planta original, mas com cinco aminoácidos a menos. A radiação deve, portanto, ter causado a deleção de: quinze pares de nucleotídeos da sequência do DNA" }
      ],
      Química: [
        { q: "4", a: "Sobre as mutações é correto afirmar que: ocorrem ao acaso, ou seja, não são direcionadas por alguma necessidade do organismo" },
        { q: "5", a: "A mutação gênica é uma alteração que ocorre na molécula de DNA ao atingir a sequência de bases. Essa mutação é determinada por falha na replicação do DNA, que, quando alterado, codifica uma mensagem que pode levar à produção de proteínas modificadas, podendo alterar o fenótipo. Durante a replicação, a fita A-C-G-T-T-A-C-C-G sofreu uma mutação a qual gerou a produção da fita complementar T-G-C-G-A-T-G-G-C, que levou essa molécula de DNA a codificar uma proteína diferente da original.: substituição de nucleotídeo. " },
        { q: "6", a: "O grande fato científico anunciado em 1997 foi o nascimento da ovelha Dolly, o primeiro clone de um animal adulto. Seu criador, o escocês Ian Wilmut, anunciou que utilizou o óvulo e uma célula de glândula mamária de ovelha para obter o clone. Foi implantado um núcleo de uma célula somática numa célula germinativa." }
      ]
    };

    function goToAreas() {
      screens.start.classList.remove('active');
      screens.areas.classList.add('active');
    }

    function showCards(area) {
      screens.areas.classList.remove('active');
      screens.cards.classList.add('active');
      document.getElementById('cards-title').innerText = area;

      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      questions[area].forEach(item => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front">${item.q}</div>
            <div class="card-back">${item.a}</div>
          </div>
        `;
        card.addEventListener('click', () => card.classList.toggle('flipped'));
        container.appendChild(card);
      });
    }

    function backToAreas() {
      screens.cards.classList.remove('active');
      screens.areas.classList.add('active');
    }
  </script>

</body>
</html>
